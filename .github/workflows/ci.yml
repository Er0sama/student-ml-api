name: CI

# Validation only. This workflow never publishes an artifact to the registry.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image without pushing it
        run: docker build -t student-ml-api:ci-${{ github.sha }} .

      - name: Smoke test the built image
        run: |
          # Cleanup must run even if the health check fails, or the container leaks.
          trap 'docker rm -f ci-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name ci-check -p 5000:5000 student-ml-api:ci-${{ github.sha }}
          for i in $(seq 1 10); do
            curl -fsS http://localhost:5000/health && break || sleep 1
          done
          curl -fsS http://localhost:5000/health | grep healthy
